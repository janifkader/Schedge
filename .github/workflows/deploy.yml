name: Build and Deploy

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/schedge-backend:latest

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/schedge-frontend:latest

      - name: Log in to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy backend to Container Apps
        run: |
          az containerapp update \
            --name schedge-backend \
            --resource-group schedule-planner-group \
            --image ${{ secrets.DOCKERHUB_USERNAME }}/schedge-backend:latest

      - name: Deploy frontend to Container Apps
        run: |
          az containerapp update \
            --name schedge-frontend \
            --resource-group schedule-planner-group \
            --image ${{ secrets.DOCKERHUB_USERNAME }}/schedge-frontend:latest